openapi: 3.0.0
info:
  title: Finance API
  description: API for accessing and managing financial data
  version: 1.0.0
servers:
  - url: /api/v1
    description: Default API server
paths:
  /accounts:
    get:
      summary: Get all accounts
      description: Retrieve a list of all financial accounts
      operationId: getAccounts
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: A list of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Create a new account
      description: Create a new financial account
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '201':
          description: Account created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /accounts/{uuid}:
    get:
      summary: Get account by UUID
      description: Retrieve a specific account by its UUID
      operationId: getAccountByUuid
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      responses:
        '200':
          description: Account found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      summary: Update an account
      description: Update an existing account by its UUID
      operationId: updateAccount
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountInput'
      responses:
        '200':
          description: Account updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Delete an account
      description: Delete an account by its UUID
      operationId: deleteAccount
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      responses:
        '204':
          description: Account deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /transactions:
    get:
      summary: Get all transactions
      description: Retrieve a list of financial transactions with optional filtering
      operationId: getTransactions
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: type
          in: query
          description: Filter by transaction type
          schema:
            type: string
            enum: [deposit, expense, order, transfer]
        - name: startDate
          in: query
          description: Filter by start date (inclusive)
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          description: Filter by end date (inclusive)
          schema:
            type: string
            format: date
        - name: accountUuid
          in: query
          description: Filter by account UUID
          schema:
            type: string
      responses:
        '200':
          description: A list of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Create a new transaction
      description: Create a new financial transaction
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /transactions/{uuid}:
    get:
      summary: Get transaction by UUID
      description: Retrieve a specific transaction by its UUID
      operationId: getTransactionByUuid
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      responses:
        '200':
          description: Transaction found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      summary: Update a transaction
      description: Update an existing transaction by its UUID
      operationId: updateTransaction
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionInput'
      responses:
        '200':
          description: Transaction updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Delete a transaction
      description: Delete a transaction by its UUID
      operationId: deleteTransaction
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      responses:
        '204':
          description: Transaction deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /items:
    get:
      summary: Get all items
      description: Retrieve a list of budget items
      operationId: getItems
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
        - name: group
          in: query
          description: Filter by item group
          schema:
            type: string
      responses:
        '200':
          description: A list of items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Item'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Create a new item
      description: Create a new budget item
      operationId: createItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /items/{uuid}:
    get:
      summary: Get item by UUID
      description: Retrieve a specific budget item by its UUID
      operationId: getItemByUuid
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      responses:
        '200':
          description: Item found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      summary: Update an item
      description: Update an existing budget item by its UUID
      operationId: updateItem
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemInput'
      responses:
        '200':
          description: Item updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      summary: Delete an item
      description: Delete a budget item by its UUID
      operationId: deleteItem
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      responses:
        '204':
          description: Item deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /contracts:
    get:
      summary: Get all contracts
      description: Retrieve a list of payment contracts
      operationId: getContracts
      parameters:
        - $ref: '#/components/parameters/limitParam'
        - $ref: '#/components/parameters/offsetParam'
      responses:
        '200':
          description: A list of contracts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      summary: Create a new contract
      description: Create a new payment contract
      operationId: createContract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractInput'
      responses:
        '201':
          description: Contract created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Contract'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  
  /contracts/{uuid}:
    get:
      summary: Get contract by UUID
      description: Retrieve a specific payment contract by its UUID
      operationId: getContractByUuid
      parameters:
        - $ref: '#/components/parameters/uuidParam'
      responses:
        '200':
          description: Contract found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Contract'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      summary: Update a contract
      description: Update an existing payment contract by its UUID
      operationId: updateContract
      parameters:
