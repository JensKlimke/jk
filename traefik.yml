# traefik.yml
api:
  dashboard: true
  insecure: false

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: traefik

certificatesResolvers:
  letsencrypt:
    acme:
      tlschallenge: true
      caserver: https://acme-staging-v02.api.letsencrypt.org/directory
      email: jens.klimke@rwth-aachen.de
      storage: /letsencrypt/acme.json