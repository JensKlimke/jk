services:

  mongodb-local:
    image: mongo:latest
    container_name: mongodb-local
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-}
      MONGO_WEB_PASSWORD: ${MONGO_WEB_PASSWORD:-webpassword}
    volumes:
      - ./mongo/data:/data/db
      - ./mongo/config:/data/configdb
      - ./services/mongo-init:/docker-entrypoint-initdb.d
    ports:
      - "27017:27017"

  mongo-express-local:
    image: mongo-express:latest
    container_name: mongo-express-local
    restart: unless-stopped
    depends_on:
      - mongodb-local
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb-local
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-}
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-password}
    ports:
      - "8081:8081"
