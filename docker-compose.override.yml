services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.dev.yml:/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic
    networks:
      - traefik

  # Auth middleware
  auth:
    build: ./services/auth
    container_name: auth
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=Host(`auth.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=3000"
    environment:
      GITHUB_AUTH_CLIENT_ID: ${GITHUB_AUTH_CLIENT_ID}
      GITHUB_AUTH_SECRET: ${GITHUB_AUTH_SECRET}
      NODE_ENV: "development"
    networks:
      - traefik

  # Example application
  whoami:
    image: traefik/whoami
    container_name: whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
      - "traefik.http.routers.whoami.middlewares=auth@file"
    networks:
      - traefik

networks:
  traefik:
    external: true
