# Default values for the webapp Helm chart
# This is a YAML-formatted file.

# Global configuration
global:
  # Domain configuration
  domain: example.com
  # Namespace configuration
  namespace: webapp

# Nginx configuration
nginx:
  image: nginx:1.21
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: "nginx"

# Website configuration
website:
  enabled: true
  title: "Welcome to DOMAIN"  # Will be replaced with actual domain in template
  content:
    heading: "Welcome to DOMAIN"  # Will be replaced with actual domain in template
    paragraphs:
      - "This is a simple static website served by Nginx on Kubernetes (k3s)."
      - "This site is accessible via both DOMAIN and www.DOMAIN domains."  # Will be replaced with actual domain in template
      - "This is a demonstration of a Kubernetes deployment with Nginx as a reverse proxy."
