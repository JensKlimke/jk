server {
    listen 443 ssl;
    server_name auth.{{ domain }};

    # Certs
    ssl_certificate /etc/nginx/certs/auth.{{ domain }}/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/auth.{{ domain }}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Forwarded uri
        proxy_set_header X-Forwarded-Uri $request_uri;

        # Allow cross-domain cookies
        proxy_cookie_domain auth.{{ domain }} $host;
        proxy_cookie_path / "/; SameSite=Lax";

        proxy_pass http://oauth2-proxy:4180;
    }
}
