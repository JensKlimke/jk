server {
    listen 443 ssl;
    server_name whoami.{{ domain }};

    # Certs
    ssl_certificate /etc/nginx/certs/whoami.{{ domain }}/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/whoami.{{ domain }}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Include common OAuth2 configuration if it exists
    include /etc/nginx/conf.d/oauth2.conf.incl*;

    location / {

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth request (commented out until oauth2-proxy is enabled)
        auth_request /oauth2/auth;
        error_page 401 =403 /oauth2/sign_in;

        # Cookie refresh handling (commented out until oauth2-proxy is enabled)
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        proxy_pass http://whoami:8000;
    }
}
