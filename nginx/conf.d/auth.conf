# auth.conf - Configuration for OAuth2 authentication endpoint
# This file configures the auth.localhost domain which handles the OAuth2 authentication flow

server {
    # Listen on port 80 for HTTP connections
    # In production, you would typically use HTTPS (port 443) with SSL certificates
    listen 80;

    # Define the server name that this configuration applies to
    # This must match the OAUTH2_PROXY_REDIRECT_URL in docker-compose.yml
    server_name auth.localhost;

    # Handle all requests to auth.localhost
    location / {
        # Forward all requests to the oauth2-proxy service running on port 4180
        # This service handles the OAuth2 authentication flow with GitHub
        proxy_pass http://oauth2-proxy:4180;

        # Pass the original host header to the oauth2-proxy
        # This is important for the proxy to generate correct redirect URLs
        proxy_set_header Host $host;

        # Pass the client's real IP address to the oauth2-proxy
        # This helps with logging and potential IP-based restrictions
        proxy_set_header X-Real-IP $remote_addr;

        # Pass the full client request chain to the oauth2-proxy
        # This includes the client IP and any intermediate proxy IPs
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pass the original protocol (http/https) to the oauth2-proxy
        # This ensures that redirects use the correct protocol
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the original request URI to the oauth2-proxy
        # This helps the proxy maintain the correct path during redirects
        proxy_set_header X-Forwarded-Uri $request_uri;

        # Cookie handling for cross-domain authentication
        # These directives are crucial for the CSRF token to work properly

        # Rewrite the domain in Set-Cookie headers from auth.localhost to the current host
        # This allows cookies set by oauth2-proxy to be valid on other domains (.localhost)
        proxy_cookie_domain auth.localhost $host;

        # Set the cookie path to root with SameSite=Lax for better security
        # SameSite=Lax allows cookies to be sent in cross-site requests only for top-level navigations
        # This prevents CSRF attacks while still allowing the authentication flow to work
        proxy_cookie_path / "/; SameSite=Lax";
    }
}
