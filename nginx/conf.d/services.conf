# Default server configuration
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Redirect all unknown hosts to a 404 page
    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name auth.marlene.cloud;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Needed for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.marlene.cloud;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/auth.marlene.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.marlene.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;


    location / {
        # General headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;


        proxy_pass http://oauth2-proxy:4180/;
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name whoami.marlene.cloud;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Needed for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name whoami.marlene.cloud;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/whoami.marlene.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whoami.marlene.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # OAuth2 endpoints
    location /oauth2/ {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-Uri $request_uri;

        # Important for CSRF cookie handling
        proxy_cookie_domain whoami.marlene.cloud $host;
        proxy_cookie_path / "/; SameSite=Lax";
    }

    # Special handling for auth endpoint
    location = /oauth2/auth {
        proxy_pass http://oauth2-proxy:4180;
        proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-Uri $request_uri;

        # nginx auth_request includes headers but not body
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;

        # Important for CSRF cookie handling
        proxy_cookie_domain whoami.marlene.cloud $host;
        proxy_cookie_path / "/; SameSite=Lax";
    }

    location / {
        # General headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth request
        auth_request /oauth2/auth;
        error_page 401 =403 /oauth2/sign_in;

        # Set auth headers
        auth_request_set $user   $upstream_http_x_auth_request_user;
        auth_request_set $email  $upstream_http_x_auth_request_email;
        proxy_set_header X-User  $user;
        proxy_set_header X-Email $email;

        auth_request_set $token  $upstream_http_x_auth_request_access_token;
        proxy_set_header X-Access-Token $token;

        # Cookie refresh handling
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        proxy_pass http://whoami:80/;
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}

