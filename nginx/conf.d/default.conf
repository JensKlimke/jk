server {
    listen 80;
    listen [::]:80;
    server_name marlene.cloud;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Reverse proxy configuration
    # This is a placeholder configuration since we don't have a webapp yet
    location / {
        # Return a temporary page indicating the server is working
        return 200 'Nginx reverse proxy is running!\n';
        add_header Content-Type text/plain;
    }

    # Example of a reverse proxy configuration (commented out for now)
    # location /api/ {
    #     proxy_pass http://webapp:8080/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}