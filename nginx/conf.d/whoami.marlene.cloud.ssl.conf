server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name whoami.marlene.cloud;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/whoami.marlene.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/whoami.marlene.cloud/privkey.pem;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Include common OAuth2 configuration if it exists
    include /etc/nginx/conf.d/oauth2.conf.incl*;

    # Reverse proxy configuration
    location / {
        # General headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Auth request
        auth_request /oauth2/auth;
        error_page 401 =403 /oauth2/sign_in;

        # Set auth headers
        auth_request_set $user   $upstream_http_x_auth_request_user;
        proxy_set_header X-User  $user;
        auth_request_set $email  $upstream_http_x_auth_request_email;
        proxy_set_header X-Email $email;
        auth_request_set $token  $upstream_http_x_auth_request_access_token;
        proxy_set_header X-Access-Token $token;

        # Cookie refresh handling
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie;

        proxy_pass http://whoami:80/;
    }

    # Health check endpoint
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}