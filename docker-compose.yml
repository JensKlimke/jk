version: '3'

services:
  nginx-conf-gen:
    build:
      context: ./services/api
    container_name: nginx-conf-gen
    volumes:
      - ./nginx/tmpl/service.conf.mustache:/app/template/service.conf.mustache:ro
      - ./nginx/conf.d:/app/output
    restart: "no"

  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - certbot:/var/www/html
      - letsencrypt:/etc/letsencrypt:ro
    restart: always
    depends_on:
      - certbot
      - nginx-conf-gen

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
      - ./services/certbot/entrypoint.sh:/certbot-entrypoint.sh
    entrypoint: "/bin/sh /certbot-entrypoint.sh"
    environment:
      DOMAINS: "whoami.${DOMAIN:-localhost} auth.${DOMAIN:-localhost}"
      EMAIL: ${EMAIL:-admin@example.com}
    restart: always

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_REFRESH: 3600s
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "*.${DOMAIN:-localhost}"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: https://auth.${DOMAIN:-localhost}/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN:-localhost}
      OAUTH2_PROXY_COOKIE_NAME: auth
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      VIRTUAL_HOST: "auth.${DOMAIN:-localhost}"
    expose:
      - "4180"

  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: always
    environment:
      VIRTUAL_HOST: "whoami.${DOMAIN:-localhost}"
    expose:
      - "80"

volumes:
  certbot:
  letsencrypt:
