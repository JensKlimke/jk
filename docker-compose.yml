version: '3'

services:
  nginx-reverse-proxy:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/html:/usr/share/nginx/html
      - certbot:/var/www/html
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - nginx-services-ts
    restart: always

  nginx-services-ts:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: nginx-services-ts
    volumes:
      - certbot:/var/www/html
      - letsencrypt:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx/tmpl/service.conf.mustache:/app/template/service.conf.mustache:ro
      - ./nginx/tmpl/default.conf.mustache:/app/template/default.conf.mustache:ro
      - ./nginx/conf.d:/app/output
      - logs:/app/logs
    environment:
      EMAIL: ${EMAIL:-admin@example.com}
      AUTH_UPSTREAM_URL: "http://oauth2-proxy:4180"
      NGINX_SERVICE: "nginx-reverse-proxy"
    restart: always

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_REFRESH: 3600s
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "*.${DOMAIN:-localhost}"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: https://auth.${DOMAIN:-localhost}/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN:-localhost}
      OAUTH2_PROXY_COOKIE_NAME: auth
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      VIRTUAL_HOST: "auth.${DOMAIN:-localhost}"
    expose:
      - "4180"

  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: always
    environment:
      VIRTUAL_HOST: "whoami.${DOMAIN:-localhost}"
      WITH_AUTH_HEADERS: true
    expose:
      - "80"

  influxdb:
    image: influxdb:2
    container_name: influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: $INFLUX_ADMIN_PW
      DOCKER_INFLUXDB_INIT_ORG: jk
      DOCKER_INFLUXDB_INIT_BUCKET: default
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: $INFLUX_ADMIN_TOKEN
      VIRTUAL_HOST: "influx.${DOMAIN:-localhost}"
    volumes:
      - influxdb-data:/var/lib/influxdb2
      - influxdb-config:/etc/influxdb2
    expose:
      - 8086

volumes:
  certbot:
  letsencrypt:
  logs:
  influxdb-data:
  influxdb-config:
