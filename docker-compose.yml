services:

  nginx-proxy:
#    image: jwilder/nginx-proxy
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./.nginx-conf.d:/etc/nginx/conf.d
      - ./test/certs:/etc/nginx/certs:ro
      - www_html:/var/www/html

  nginx-template-processor:
    image: alpine:latest
    container_name: nginx-template-processor
    restart: unless-stopped
    volumes:
      - ./.nginx-conf.d:/etc/nginx/conf.d
      - ./nginx/conf.d.tmpl:/etc/nginx/conf.d.tmpl
      - ./nginx/template-processor.sh:/template-processor.sh
      - ./test/certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    command: sh -c "apk add --no-cache procps grep sed docker-cli && chmod +x /template-processor.sh && /template-processor.sh"
    depends_on:
      - nginx-proxy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "template-processor.sh"]
      interval: 30s
      timeout: 10s
      retries: 3

  whoami:
    image: jwilder/whoami
    container_name: whoami
    expose:
      - "8000"
    environment:
      - VIRTUAL_HOST=whoami.localhost

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    environment:
      - VIRTUAL_HOST=auth.localhost
      - OAUTH2_PROXY_PROVIDER=github
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET}
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_COOKIE_SECURE=false
      - OAUTH2_PROXY_COOKIE_REFRESH=3600s
      - OAUTH2_PROXY_REVERSE_PROXY=true
      - OAUTH2_PROXY_WHITELIST_DOMAINS=*.localhost
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REDIRECT_URL=https://auth.localhost/oauth2/callback
      - OAUTH2_PROXY_COOKIE_DOMAINS=.localhost
      - OAUTH2_PROXY_COOKIE_NAME=_oauth2_proxy
      - OAUTH2_PROXY_COOKIE_SAMESITE=lax
      - OAUTH2_PROXY_CSRF_COOKIE_NAME=_oauth2_proxy_csrf
      - OAUTH2_PROXY_SET_XAUTHREQUEST=true
      - OAUTH2_PROXY_PASS_ACCESS_TOKEN=true
    expose:
      - "4180"


