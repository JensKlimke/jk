services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - traefik

  # Cookie middleware application
  cookie-middleware:
    build: ./services/auth
    container_name: cookie-middleware
    environment:
      - NODE_ENV=production
      - PORT=3000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cookie-middleware.rule=Host(`app.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.cookie-middleware.entrypoints=web"
      - "traefik.http.services.cookie-middleware.loadbalancer.server.port=3000"
      # For HTTPS (uncomment when ready)
      # - "traefik.http.routers.cookie-middleware.entrypoints=websecure"
      # - "traefik.http.routers.cookie-middleware.tls.certresolver=letsencrypt"
    networks:
      - traefik

  # Example application
  whoami:
    image: traefik/whoami
    container_name: whoami
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`whoami.${DOMAIN:-localhost}`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
      # For HTTPS (uncomment when ready)
      # - "traefik.http.routers.whoami.entrypoints=websecure"
      # - "traefik.http.routers.whoami.tls.certresolver=letsencrypt"
    networks:
      - traefik

networks:
  traefik:
    external: true
