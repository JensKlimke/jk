version: '3'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - certbot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    restart: always
    depends_on:
      - certbot
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot certonly --webroot --webroot-path=/var/www/certbot --email jens.klimke@rwth-aachen.de --agree-tos --no-eff-email -d whoami.marlene.cloud --force-renewal; sleep 12h & wait $${!}; done;'"
    restart: always
  whoami:
    image: traefik/whoami
    container_name: whoami
    restart: always

volumes:
  certbot:
  letsencrypt:
