version: '3'

services:
  nginx:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - certbot:/var/www/certbot
    restart: always
  whoami:
    image: traefik/whoami
    container_name: whoami

volumes:
  certbot:
  