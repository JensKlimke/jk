version: '3.8'

services:
  # Traefik - Reverse Proxy
  traefik:
    image: traefik:v2.9
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/conf.yml:ro
      - ./certificates:/certificates
    networks:
      - ${TRAEFIK_NETWORK}
    labels:
      - "traefik.enable=true"
      # Dashboard
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DASHBOARD_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth@file,secure-headers@file"

  # OAuth2 Proxy - Authentication Provider
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.4.0
    container_name: oauth2-proxy
    restart: unless-stopped
    depends_on:
      - traefik
    environment:
      - OAUTH2_PROXY_PROVIDER=${OAUTH2_PROVIDER}
      - OAUTH2_PROXY_CLIENT_ID=${OAUTH2_CLIENT_ID}
      - OAUTH2_PROXY_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
      - OAUTH2_PROXY_COOKIE_SECRET=${OAUTH2_COOKIE_SECRET}
      - OAUTH2_PROXY_EMAIL_DOMAINS=*
      - OAUTH2_PROXY_COOKIE_SECURE=true
      - OAUTH2_PROXY_HTTP_ADDRESS=0.0.0.0:4180
      - OAUTH2_PROXY_REDIRECT_URL=https://${OAUTH2_SUBDOMAIN}.${DOMAIN}/oauth2/callback
      - OAUTH2_PROXY_UPSTREAMS=http://protected-app:80
      - OAUTH2_PROXY_COOKIE_REFRESH=1h
      - OAUTH2_PROXY_COOKIE_EXPIRE=4h
      - OAUTH2_PROXY_SKIP_PROVIDER_BUTTON=true
    networks:
      - ${TRAEFIK_NETWORK}
      - ${INTERNAL_NETWORK}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.oauth2.rule=Host(`${OAUTH2_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.oauth2.entrypoints=websecure"
      - "traefik.http.routers.oauth2.tls.certresolver=letsencrypt"
      - "traefik.http.services.oauth2.loadbalancer.server.port=4180"
      - "traefik.http.routers.oauth2.middlewares=secure-headers@file"

  # Protected Web Application
  protected-app:
    image: nginx:alpine
    container_name: protected-app
    restart: unless-stopped
    volumes:
      - ./services/web-apps/protected:/usr/share/nginx/html:ro
    networks:
      - ${TRAEFIK_NETWORK}
      - ${INTERNAL_NETWORK}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.protected-app.rule=Host(`${PROTECTED_APP_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.protected-app.entrypoints=websecure"
      - "traefik.http.routers.protected-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.protected-app.middlewares=oauth2-auth@file,secure-headers@file"

  # Public Web Application
  public-app:
    image: nginx:alpine
    container_name: public-app
    restart: unless-stopped
    volumes:
      - ./services/web-apps/public:/usr/share/nginx/html:ro
    networks:
      - ${TRAEFIK_NETWORK}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.public-app.rule=Host(`${PUBLIC_APP_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.public-app.entrypoints=websecure"
      - "traefik.http.routers.public-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.public-app.middlewares=secure-headers@file"

  # API Service
  api-service:
    build:
      context: ./services/api-service
    container_name: api-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - API_TOKEN=${API_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      - postgres
      - redis
    networks:
      - ${TRAEFIK_NETWORK}
      - ${INTERNAL_NETWORK}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`${API_SUBDOMAIN}.${DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=3000"
      - "traefik.http.routers.api.middlewares=api-token@file,secure-headers@file,rate-limit@file"
      # Public health endpoint without token auth
      - "traefik.http.routers.api-health.rule=Host(`${API_SUBDOMAIN}.${DOMAIN}`) && PathPrefix(`/health`)"
      - "traefik.http.routers.api-health.entrypoints=websecure"
      - "traefik.http.routers.api-health.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-health.middlewares=secure-headers@file"
      - "traefik.http.routers.api-health.priority=110"

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ${INTERNAL_NETWORK}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks:
      - ${INTERNAL_NETWORK}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:

networks:
  traefik:
    name: ${TRAEFIK_NETWORK}
    external: true
  internal:
    name: ${INTERNAL_NETWORK}
    external: true
