services:
  nginx-reverse-proxy:
    image: nginx:latest
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/html:/usr/share/nginx/html
      - nginx:/etc/nginx/conf.d
      - certbot:/var/www/html
      - letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - nginx-services
    restart: always

  nginx-services:
    build:
      context: ./services/nginx-service
      dockerfile: Dockerfile
    container_name: nginx-services
    volumes:
      - certbot:/var/www/html
      - letsencrypt:/etc/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./nginx/tmpl/service.conf.mustache:/app/template/service.conf.mustache:ro
      - ./nginx/tmpl/default.conf.mustache:/app/template/default.conf.mustache:ro
      - nginx:/app/output
      - logs:/app/logs
    environment:
      EMAIL: ${EMAIL:-admin@example.com}
      AUTH_UPSTREAM_URL: "http://oauth2-proxy:4180"
      NGINX_SERVICE: "nginx-reverse-proxy"
    restart: always

  webhook-service:
    build:
      context: ./services/webhook-service
      dockerfile: Dockerfile
    container_name: webhook-service
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      VIRTUAL_HOST: "deploy.${DOMAIN:-localhost}"
    volumes:
      - www:/var/www
    restart: always
    expose:
      - "3000"

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    container_name: oauth2-proxy
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_REFRESH: 3600s
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "*.${DOMAIN:-localhost}"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REDIRECT_URL: https://auth.${DOMAIN:-localhost}/oauth2/callback
      OAUTH2_PROXY_COOKIE_DOMAINS: .${DOMAIN:-localhost}
      OAUTH2_PROXY_COOKIE_NAME: auth
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      VIRTUAL_HOST: "auth.${DOMAIN:-localhost}"
    expose:
      - "4180"


volumes:
  certbot:
  letsencrypt:
  logs:
  nginx:
  www:
