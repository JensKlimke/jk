# Traefik Dynamic Configuration

http:
  middlewares:
    # Basic Authentication for Traefik Dashboard
    traefik-auth:
      basicAuth:
        users:
          - "${TRAEFIK_DASHBOARD_USER}:${TRAEFIK_DASHBOARD_PASSWORD_HASH}"

    # OAuth2 Authentication
    oauth2-auth:
      forwardAuth:
        address: "http://oauth2-proxy:4180/oauth2/auth"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-Auth-Request-User"
          - "X-Auth-Request-Email"
          - "X-Auth-Request-Access-Token"

    # API Token Authentication
    api-token:
      headers:
        customRequestHeaders:
          X-Api-Key: "${API_TOKEN}"
      plugin:
        api-auth:
          # Token is required in Authorization header
          header: "Authorization"
          prefix: "Bearer "
          token: "${API_TOKEN}"

    # Security Headers for all responses
    secure-headers:
      headers:
        frameDeny: true
        sslRedirect: true
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "SAMEORIGIN"
        contentSecurityPolicy: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'"

    # Rate Limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 10s

    # IP Whitelisting
    ip-whitelist:
      ipWhiteList:
        sourceRange:
          - "${ALLOWED_IPS}"

    # CORS Headers
    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - OPTIONS
          - PUT
          - POST
          - DELETE
        accessControlAllowOriginList:
          - "https://${DOMAIN}"
          - "https://*.${DOMAIN}"
        accessControlAllowHeaders:
          - "Authorization"
          - "Content-Type"
        accessControlMaxAge: 100
        addVaryHeader: true

# Custom Plugin for API Authentication
plugins:
  api-auth:
    moduleName: "github.com/traefik/plugin-api-auth"
    version: "v0.2.0"
