# File: traefik/dynamic/middleware.yml
http:
  middlewares:
    auth:
      forwardAuth:
        address: "http://auth:3000/auth"
        authRequestHeaders:
          - "Cookie"
          - "Authorization"
        authResponseHeaders:
          - "X-User-Id"
          - "X-User-Role"
        authResponseHeadersRegex: "^X-"
        trustForwardHeader: true
